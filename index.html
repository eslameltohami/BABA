<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>بابا</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ffb703"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(160deg,#8ecae6,#fff1b8 55%,#ffc6d9) fixed;min-height:100vh;color:#23304a;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.logo{font-size:44px;font-weight:900;background:linear-gradient(90deg,#ff6b6b,#ffb703,#06d6a0,#118ab2);-webkit-background-clip:text;background-clip:text;color:transparent}
button,.card{font:inherit;cursor:pointer}
.b{border:0;border-radius:22px;padding:12px 18px;font-size:20px;font-weight:700;background:#fff;box-shadow:0 5px 0 #0002}
.main{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px;max-width:560px;margin:auto}
.t{border:0;border-radius:30px;padding:26px 8px;font-size:24px;font-weight:800;color:#fff;box-shadow:0 8px 0 #0003;display:flex;flex-direction:column;align-items:center;gap:6px}
.t span{font-size:56px}
.v{padding:12px 14px;max-width:640px;margin:auto}
.card{background:#fff;border-radius:20px;padding:16px;margin:10px 0;font-size:20px;box-shadow:0 4px 0 #0002}
.q{font-size:48px;text-align:center;background:#fff;border-radius:26px;padding:20px;margin:12px 0;line-height:1.5}
.o{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.o button{font-size:40px;padding:18px 0}
video,iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000}
textarea,input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:14px;border:2px solid #0002;margin:6px 0}
.sc{background:#fff;border-radius:20px;padding:10px;margin:12px 0;text-align:center}.sc img{width:100%;border-radius:14px;min-height:120px;background:#eee}
#wg{display:grid;grid-template-columns:1fr 1fr;gap:10px}#wg canvas{width:100%;border-radius:16px;box-shadow:0 4px 0 #0003}
#lock{position:fixed;inset:0;background:#118ab2;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:26px;z-index:9;text-align:center;padding:20px}
.shake{animation:s .3s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
[hidden]{display:none!important}
</style></head><body>
<header><div class="logo">🐻 بابا</div><button class="b" onclick="parent()">🔒</button></header>

<section id="hm" class="v"><div class="main">
<button class="t" style="background:#ef476f" onclick="go('vd');vlist()"><span>🎬</span>فيديوهات</button>
<button class="t" style="background:#06a77d" onclick="go('gs')"><span>🎮</span>ألعاب</button>
<button class="t" style="background:#ff9f1c" onclick="go('sy')"><span>✨</span>احكي قصتك</button>
<button class="t" style="background:#118ab2" onclick="go('wl');wp()"><span>🖼️</span>خلفيات</button>
</div></section>

<section id="vd" class="v" hidden><button class="b" onclick="go('hm')">🏠 رجوع</button><div id="vl"></div>
<div id="pl" hidden><video id="vid" controls playsinline></video><iframe id="yt" allowfullscreen allow="encrypted-media;picture-in-picture" hidden></iframe><button id="sv" class="b" style="margin-top:10px">⬇️ حفظ للمشاهدة بدون نت</button></div></section>

<section id="gs" class="v" hidden><button class="b" onclick="go('hm')">🏠 رجوع</button>
<div class="card" onclick="game('c')">🔢 عدّ معايا</div><div class="card" onclick="game('l')">🔤 الحروف</div><div class="card" onclick="game('m')">➕ الجمع</div></section>
<section id="gm" class="v" hidden><button class="b" onclick="go('gs')">⬅️ رجوع</button> <b id="sc" style="font-size:26px">⭐ 0</b><div id="gq"></div></section>

<section id="sy" class="v" hidden><button class="b" onclick="go('hm')">🏠 رجوع</button>
<h2>احكي أو اكتب قصة قصيرة ✨</h2><textarea id="st" rows="3" placeholder="مثلاً: أرنب صغير سافر إلى القمر"></textarea>
<button class="b" id="mic" onclick="mic()">🎤 اتكلم</button> <button class="b" style="background:#ffd166" onclick="story()">🎨 اعمل القصة</button> <button class="b" onclick="speak(window.txt)">🔊 اقرأها</button><div id="so"></div></section>

<section id="wl" class="v" hidden><button class="b" onclick="go('hm')">🏠 رجوع</button><h2>اضغط على الخلفية لتحميلها 📲</h2><div id="wg"></div></section>

<section id="pa" class="v" hidden><button class="b" onclick="go('hm')">🏠 خروج</button><h2>🔒 الحماية الأبوية</h2>
<div class="card">⏱️ الوقت اليومي (دقيقة)<input id="lim" type="number" min="5"><button class="b" onclick="S.limit=+$('#lim').value||60;save();alert('تم')">حفظ</button></div>
<div class="card">🔑 رقم سري جديد<input id="np" inputmode="numeric" maxlength="6"><button class="b" onclick="if($('#np').value.length>=4){S.pin=$('#np').value;save();alert('تم')}">تغيير</button></div>
<div class="card">➕ إضافة فيديو (رابط يوتيوب أو رابط mp4)<input id="vt" placeholder="اسم الفيديو"><input id="vu" placeholder="الرابط" dir="ltr"><button class="b" onclick="addv()">إضافة</button></div>
<div id="pv"></div><div class="card">📧 تسجيل الدخول بجيميل: يُضاف في النسخة التالية.</div></section>

<div id="lock" hidden>⏰ خلص وقت اللعب النهارده!<br>نشوفك بكرة 👋<button class="b" onclick="unlock()">🔒 للكبار</button></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const D=new Date().toISOString().slice(0,10);
let S=Object.assign({pin:'1234',limit:60,day:D,used:0,saved:[],vids:[{t:'الأرنب الكبير 🐰',u:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4'}]},JSON.parse(localStorage.baba||'{}'));
if(S.day!==D){S.day=D;S.used=0}
const save=()=>localStorage.baba=JSON.stringify(S);
function go(id){$$('.v').forEach(e=>e.hidden=e.id!==id);$('#vid').pause();$('#yt').src='';$('#pl').hidden=true;speechSynthesis.cancel();scrollTo(0,0)}
go('hm');
/* وقت اللعب */
function chk(){$('#lock').hidden=S.used<S.limit}
setInterval(()=>{if(!document.hidden){S.used++;save();chk()}},60000);chk();
function unlock(){if(prompt('الرقم السري')===S.pin){S.used=Math.max(0,S.limit-15);save();chk()}}
/* فيديوهات */
const yid=u=>(u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/)||[])[1];
function vlist(){$('#vl').innerHTML=S.vids.map((v,i)=>`<div class="card" onclick="play(${i})">▶️ ${esc(v.t)} ${S.saved.includes(v.u)?'✅':''}</div>`).join('')||'<div class="card">لا توجد فيديوهات</div>'}
async function play(i){const v=S.vids[i],m=yid(v.u),vd=$('#vid'),f=$('#yt'),sv=$('#sv');$('#pl').hidden=false;
 if(m){vd.pause();vd.hidden=true;f.hidden=false;f.src='https://www.youtube-nocookie.com/embed/'+m+'?rel=0&modestbranding=1';sv.hidden=true}
 else{f.hidden=true;f.src='';vd.hidden=false;sv.hidden=false;sv.textContent='⬇️ حفظ للمشاهدة بدون نت';sv.onclick=()=>dl(v.u);
  const r=await caches.match(v.u);vd.src=r?URL.createObjectURL(await r.blob()):v.u;vd.play().catch(()=>{})}
 $('#pl').scrollIntoView()}
async function dl(u){const sv=$('#sv');sv.textContent='⏳ جاري الحفظ...';try{const r=await fetch(u);if(!r.ok)throw 0;await(await caches.open('vids')).put(u,r);if(!S.saved.includes(u))S.saved.push(u);save();sv.textContent='✅ تم الحفظ';vlist()}catch(e){sv.textContent='⚠️ الرابط ده مش بيسمح بالحفظ'}}
/* ألعاب */
const L=[['أ','أرنب','🐰'],['ب','بطة','🦆'],['ج','جمل','🐫'],['ح','حصان','🐴'],['د','دب','🐻'],['س','سمكة','🐟'],['ف','فيل','🐘'],['ق','قطة','🐱'],['ع','عنب','🍇'],['ز','زرافة','🦒']];
let sc=0;const r=n=>Math.floor(Math.random()*n);
function game(t){go('gm');sc=0;$('#sc').textContent='⭐ 0';nq(t)}
function nq(t){let q,a,o;
 if(t=='c'){a=1+r(9);q=['🍎','🐥','⭐','🎈','🐟'][r(5)].repeat(a)+'<br>كام واحد؟'}
 else if(t=='m'){const x=1+r(5),y=1+r(5);a=x+y;q=`${x} ➕ ${y} = ؟`}
 else{const k=L[r(L.length)];a=k[0];q=k[2]+'<br>'+k[1]+' تبدأ بحرف؟'}
 o=[a];while(o.length<3){const w=t=='l'?L[r(L.length)][0]:Math.max(1,a+r(7)-3);if(!o.includes(w))o.push(w)}
 o.sort(()=>Math.random()-.5);
 $('#gq').innerHTML=`<div class="q">${q}</div><div class="o">`+o.map(x=>`<button class="b">${x}</button>`).join('')+'</div>';
 $$('#gq .o button').forEach(b=>b.onclick=()=>{if(b.textContent==a){sc++;$('#sc').textContent='⭐ '+sc;b.style.background='#7bf1a8';setTimeout(()=>nq(t),500)}else{b.classList.add('shake');b.style.background='#ffb3b3'}})}
/* قصة */
const BAD=/قتل|دم|سلاح|مسدس|جنس|عاري|رعب|مخدر|kill|blood|gun|nude|sex/i;
function speak(t){if(!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';u.rate=.9;speechSynthesis.speak(u)}
function story(){const t=$('#st').value.trim();if(!t)return;if(BAD.test(t)){$('#so').innerHTML='<div class="card">🙈 جرّب فكرة تانية لطيفة!</div>';return}
 let p=t.split(/[.!؟?\n،]+/).map(s=>s.trim()).filter(Boolean).slice(0,4);if(p.length<3)p=[t,t+' ومغامرة جميلة',t+' ونهاية سعيدة'];
 window.txt=p.join('. ');const seed=Date.now()%9999;
 $('#so').innerHTML=p.map((s,i)=>`<div class="sc"><img alt="" src="https://image.pollinations.ai/prompt/${encodeURIComponent('cute colorful children storybook illustration, friendly, safe for kids, '+s)}?width=512&height=512&nologo=true&seed=${seed+i}"><p style="font-size:20px">${esc(s)}</p></div>`).join('');speak(window.txt)}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('المتصفح ده مش بيدعم الكلام. اكتب القصة.');const x=new R();x.lang='ar-EG';x.onresult=e=>$('#st').value=e.results[0][0].transcript;$('#mic').textContent='👂 بسمعك...';x.onend=()=>$('#mic').textContent='🎤 اتكلم';x.start()}
/* خلفيات */
const W=[['#ff9a9e','#fad0c4','🌈'],['#a18cd1','#fbc2eb','🦄'],['#84fab0','#8fd3f4','🐸'],['#ffecd2','#fcb69f','🍭'],['#89f7fe','#66a6ff','🐳'],['#fddb92','#d1fdff','⭐'],['#f6d365','#fda085','🦁'],['#c2e9fb','#a1c4fd','🚀']];
function draw(c,i,w,h){c.width=w;c.height=h;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,W[i][0]);g.addColorStop(1,W[i][1]);x.fillStyle=g;x.fillRect(0,0,w,h);x.font=w/8+'px serif';x.textAlign='center';x.textBaseline='middle';for(let a=0;a*w/4<h+w/4;a++)for(let k=0;k<5;k++)x.fillText(W[i][2],(k+(a%2?.5:0))*w/4,a*w/4+w/8)}
function wp(){const g=$('#wg');g.innerHTML='';W.forEach((_,i)=>{const c=document.createElement('canvas');draw(c,i,180,320);c.onclick=()=>{const b=document.createElement('canvas');draw(b,i,1080,1920);b.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='baba-'+(i+1)+'.png';a.click()})};g.append(c)})}
/* أبوي */
function parent(){const p=prompt('🔒 للكبار فقط: اكتب الرقم السري');if(p===S.pin){$('#lim').value=S.limit;pv();go('pa')}else if(p!==null)alert('رقم غلط')}
function pv(){$('#pv').innerHTML=S.vids.map((v,i)=>`<div class="card">${esc(v.t)} <button class="b" onclick="S.vids.splice(${i},1);save();pv()">🗑️</button></div>`).join('')}
function addv(){const t=$('#vt').value.trim(),u=$('#vu').value.trim();if(!t||!/^https?:\/\//.test(u))return alert('اكتب الاسم والرابط');S.vids.push({t,u});save();$('#vt').value=$('#vu').value='';pv()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
